# Builds ForgeCode on macOS, Linux and Windows. A tag `v*` (e.g. `git tag v0.1.0 && git push --tags`)
# also publishes the files on the repository's Releases page; "Run workflow" only builds them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64 }
          - { os: macos-14, name: macos-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # GPUI's window, input, font and sound libraries.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev libasound2-dev libzstd-dev

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ./scripts/bundle.sh
          app=$(find target -maxdepth 4 -path '*/bundle/ForgeCode.app' | head -1)
          ditto -c -k --keepParent "$app" "ForgeCode-${{ matrix.name }}.zip"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          tar -czf "ForgeCode-${{ matrix.name }}.tar.gz" -C target/release forgecode

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          Compress-Archive -Path target/release/forgecode.exe -DestinationPath "ForgeCode-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ForgeCode-${{ matrix.name }}
          path: ForgeCode-${{ matrix.name }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
